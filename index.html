<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>在庫スキャン</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 560px;
      margin: 0 auto;
      padding: 16px;
      background: #f5f5f5;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 8px;
    }
    .card {
      background: #fff;
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
    }
    label {
      display: block;
      margin-top: 10px;
      font-weight: 700;
    }
    input, select, textarea {
      width: 100%;
      box-sizing: border-box;
      font-size: 16px;
      padding: 10px;
      margin-top: 4px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }
    #reader {
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
    }
    #status {
      font-weight: 700;
      line-height: 1.6;
    }
    .small {
      color: #666;
      font-size: 13px;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <h1>在庫スキャン</h1>

  <div class="card">
    <label>処理</label>
    <select id="action" onchange="toggleFields()">
      <option>入荷登録</option>
      <option>持出</option>
      <option>返却</option>
      <option>納品</option>
      <option>修理</option>
      <option>棚卸</option>
      <option>廃棄</option>
    </select>

    <div id="receiveFields">
      <label>カテゴリ 必須</label>
      <select id="category">
        <option value="">選択してください</option>
        <option>POS本体</option>
        <option>テーブルオーダー端末</option>
        <option>プリンタ</option>
        <option>キャッシュドロア</option>
        <option>ルーター</option>
        <option>ハンディ端末</option>
        <option>充電器・ケーブル</option>
        <option>その他</option>
      </select>

      <label>商品名 必須</label>
      <input id="name" placeholder="例：東芝POS、iPad、レシートプリンタ">

      <label>状態 任意</label>
      <input id="condition" placeholder="例：動作品、未確認、ジャンク">

      <label>付属品メモ 任意</label>
      <textarea id="accessories" rows="2" placeholder="例：ACアダプタあり、鍵なし、スタンド付き"></textarea>
    </div>

    <div id="normalFields" class="hidden">
      <label>担当者</label>
      <input id="user" placeholder="例：田中">

      <label>目的</label>
      <input id="purpose" placeholder="例：A社デモ、納品、修理確認">

      <label>持出先・納品先</label>
      <input id="destination" placeholder="例：A社、現場名">

      <label>メモ</label>
      <textarea id="note" rows="2" placeholder="状態変化、注意点など"></textarea>
    </div>
  </div>

  <div class="card">
    <div id="reader"></div>
  </div>

  <div class="card">
    <div id="status">QRコードを読み取ってください。</div>
    <div class="small">同じQRは3秒以内なら二重記録しません。</div>
  </div>

  <script>
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbz2HtyQLoU5cegPXqgIKNb9RqYTuuRsODoeWTu2W0IhgZPq3nJaN4RP7i0ZiqQ7ujie/exec';
    const SECRET = 'zaiko-test-001';

    let lastText = '';
    let lastTime = 0;

    function getValue(id) {
      const el = document.getElementById(id);
      return el ? el.value.trim() : '';
    }

    function setStatus(message) {
      document.getElementById('status').innerHTML =
        new Date().toLocaleTimeString() + '<br>' + message;
    }

    function toggleFields() {
      const action = getValue('action');
      const receiveFields = document.getElementById('receiveFields');
      const normalFields = document.getElementById('normalFields');

      if (action === '入荷登録') {
        receiveFields.classList.remove('hidden');
        normalFields.classList.add('hidden');
      } else {
        receiveFields.classList.add('hidden');
        normalFields.classList.remove('hidden');
      }
    }

    function validate() {
      const action = getValue('action');

      if (action === '入荷登録') {
        if (!getValue('category')) {
          setStatus('カテゴリを選んでください。');
          return false;
        }

        if (!getValue('name')) {
          setStatus('商品名を入力してください。');
          return false;
        }

        return true;
      }

      if (action === '持出' && !getValue('user')) {
        setStatus('持出時は担当者を入力してください。');
        return false;
      }

      return true;
    }

    function sendScan(assetId) {
      if (!validate()) return;

      const payload = {
        secret: SECRET,
        assetId: assetId,
        action: getValue('action'),
        user: getValue('user'),
        category: getValue('category'),
        name: getValue('name'),
        condition: getValue('condition'),
        accessories: getValue('accessories'),
        purpose: getValue('purpose'),
        destination: getValue('destination'),
        note: getValue('note'),
        clientTs: new Date().toISOString()
      };

      const callbackName = 'zaikoCallback_' + Date.now();
      const script = document.createElement('script');

      window[callbackName] = function(result) {
        delete window[callbackName];

        if (script.parentNode) {
          script.parentNode.removeChild(script);
        }

        if (result && result.ok) {
          setStatus(
            result.message + '：<br>' +
            result.assetId + '<br>' +
            result.action
          );

          if (navigator.vibrate) {
            navigator.vibrate(120);
          }
        } else {
          setStatus('記録失敗：<br>' + (result && result.error ? result.error : '原因不明'));
        }
      };

      script.src =
        WEB_APP_URL +
        '?callback=' + encodeURIComponent(callbackName) +
        '&payload=' + encodeURIComponent(JSON.stringify(payload)) +
        '&t=' + Date.now();

      script.onerror = function() {
        delete window[callbackName];
        setStatus('送信エラー：Apps Script URLまたは公開設定を確認してください。');
      };

      document.body.appendChild(script);
    }

    function onScanSuccess(decodedText) {
      const text = decodedText.trim();
      const now = Date.now();

      if (!text) return;

      if (text === lastText && now - lastTime < 3000) {
        return;
      }

      lastText = text;
      lastTime = now;

      sendScan(text);
    }

    function onScanFailure(error) {
      // 読み取り失敗は無視
    }

    toggleFields();

    const scanner = new Html5QrcodeScanner(
      'reader',
      {
        fps: 10,
        qrbox: { width: 250, height: 250 },
        rememberLastUsedCamera: true,
        supportedScanTypes: [
          Html5QrcodeScanType.SCAN_TYPE_CAMERA
        ]
      },
      false
    );

    scanner.render(onScanSuccess, onScanFailure);
  </script>
</body>
</html>
